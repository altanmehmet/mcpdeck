name: Agent compatibility
description: Request or correct MCP/global-instruction support for an agent.
labels: [compatibility]
body:
  - type: input
    id: agent
    attributes:
      label: Agent, version and platform
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Capability
      options:
        - MCP configuration
        - Global personal instructions
        - Installation planner
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official documentation
      description: Link the agent's documented format or instruction location.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior and minimal example
      description: Separate global from project-specific settings. Use placeholders, never real credentials.
    validations:
      required: true
