name: Feature request
description: Propose a focused improvement to the CLI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current workflow and where it fails.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives and effects on existing commands/configuration.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use public examples; do not include private data.
