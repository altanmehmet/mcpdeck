name: Bug report
description: Report a reproducible CLI, installation or sync problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste credentials, full deck/agent settings or raw planner conversations. Report vulnerabilities privately through Security → Report a vulnerability."
  - type: input
    id: version
    attributes:
      label: MCPDeck version
      description: Output of mcpdeck --version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: "macOS ARM64 / Windows 11 x64 / Ubuntu x64"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install method
      placeholder: Homebrew, Windows bootstrap, archive or source
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: Include the planner/MCP runtime version when relevant.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic values and the smallest example that shows the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Inspect output before sharing; remove private paths, server names, tokens and connection strings.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private configuration from this report.
          required: true
